backend:
  name: github
  repo: AhmaddAssegaff/company-profile-fosti
  branch: master

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: blog
    label: Blog
    folder: frontend/src/content/blogs/
    create: true
    slug: "{{slug}}"
    extension: md

    fields:
      - name: title
        label: Title
        widget: string

      - name: description
        label: Description
        widget: text

      - name: date
        label: Date
        widget: datetime

      - name: author
        label: Author
        widget: string

      - name: tags
        label: Tags
        widget: list

      - name: body
        label: Content
        widget: markdown
